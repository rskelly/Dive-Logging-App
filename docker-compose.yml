services:
  dive-logging:
    build:
      context: .
      # owner of ./data on the host
      args:
        SHINY_UID: ${DIVELOG_UID:-1000}
        SHINY_GID: ${DIVELOG_GID:-1000}
    image: dive-logging-app
    restart: unless-stopped
    # Only reachable from the host, through the reverse proxy
    ports:
      - "127.0.0.1:3841:3841"
    # log db, lookups db and exports
    volumes:
      - ./data:/data
    environment:
      # where "Update lookups" downloads people and instruments from
      MSEA_API_URL: ${MSEA_API_URL:-http://host.docker.internal/api/v2}
    # lets the default MSEA_API_URL reach an API running on the host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 1g
