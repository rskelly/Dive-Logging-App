# Shiny Server config used inside the Docker image. The server itself runs
# as "shiny" (see Dockerfile), so run_as must match.
run_as shiny;

server {
  # 3841, not the default 3838, to avoid clashing with integrated_gf_shiny
  # (3838), shiny-qc (3839) and future_habitats_gf_shiny (3840)
  listen 3841;

  # Serve the single app at the base URL
  location / {
    app_dir /srv/shiny-server/app;
    log_dir /var/log/shiny-server;

    # Keep the R process alive between visitors so nobody waits for startup.
    # There is only ever one R process, so the SQLite files have one writer.
    app_idle_timeout 0;
  }
}
