# nginx reverse proxy for the Dive Logging Shiny app container.
# Include inside an existing server { } block, e.g. in
# /etc/nginx/sites-available/<site>, then: sudo nginx -t && sudo systemctl reload nginx
#
# Serves the app at https://<host>/dive_logging/ . To serve it at the
# site root instead, change both locations to "/".

location = /dive_logging {
  return 301 /dive_logging/;
}

location /dive_logging/ {
  # trailing slash strips the /dive_logging prefix before passing to the app
  proxy_pass http://127.0.0.1:3841/;

  # Shiny uses websockets
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # keep idle websocket sessions open
  proxy_read_timeout 1h;
  proxy_buffering off;
}
